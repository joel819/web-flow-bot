{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}<h1>Sign in</h1>
{% if error %}<div class="error" role="alert" id="login-error">{{ error }}</div>{% endif %}
<form method="post" action="/login" id="login-form">
<label for="user">Username</label><input type="text" id="user" name="user" autocomplete="username">
<label for="pw">Password</label><input type="password" id="pw" name="pw" autocomplete="current-password">
<button type="submit">Sign in</button></form>{% endblock %}
